name: Release catalog

on:
  push:
    tags:
      - 'ezb-*'

jobs:
  catalog:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Generate targets list
        shell: bash
        run: |
          set -euo pipefail

          make targets | awk '
            $NF ~ /^(\[[A-Z0-9]+\]|\([A-Z0-9]+\))$/ {
              name = $1
              mcu = $NF
              gsub(/[][+()]/, "", name)
              print name "," substr(mcu, 2, length(mcu) - 2)
            }
          ' | sort -u | jq -Rn '
            [inputs | split(",") | {config: .[0], mcu: .[1]}]
          ' > targets.generated.json

      - name: Generate builds.json
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          sha="$(git rev-parse HEAD)"
          jq -n --arg version "$version" --arg commit "$sha" --slurpfile options build_options.json --slurpfile targets targets.generated.json '{version: $version, commit: $commit, options: $options[0].options, targets: $targets[0]}' > builds.json
          cat builds.json

      - name: Create release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "Release уже существует"
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --notes "ezBeta $GITHUB_REF_NAME" \
              builds.json
          fi
