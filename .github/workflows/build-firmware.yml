name: Build firmware

on:
  workflow_dispatch:
    inputs:
      config:
        description: 'Таргет платы (CONFIG), например HAKRCF405V2'
        required: true
        type: string
      options:
        description: 'EXTRA_FLAGS: флаги через пробел, например USE_VTX USE_SERVOS'
        required: false
        type: string
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      BF_CONFIG: ${{ inputs.config }}
      BF_OPTIONS: ${{ inputs.options }}

    steps:
      - name: Validate inputs
        shell: bash
        run: |
          [[ "$BF_CONFIG" =~ ^[A-Z0-9_]{1,32}$ ]] || {
            echo "::error::Недопустимое имя CONFIG"
            exit 1
          }

          # Разрешены только имена макросов и обычные пробелы.
          [[ ${#BF_OPTIONS} -le 512 && "$BF_OPTIONS" =~ ^[A-Z0-9_\ ]*$ ]] || {
            echo "::error::Передавай имена макросов через пробел, без -D"
            exit 1
          }

          read -r -a options <<< "$BF_OPTIONS"
          for option in "${options[@]}"; do
            [[ "$option" =~ ^[A-Z_][A-Z0-9_]*$ ]] || {
              echo "::error::Недопустимое имя макроса: $option"
              exit 1
            }
          done

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install required ARM toolchain
        run: make arm_sdk_install

      - name: Build
        shell: bash
        run: |
          flags=(-DCLOUD_BUILD)
          read -r -a options <<< "$BF_OPTIONS"
          for option in "${options[@]}"; do
            flags+=("-D$option")
          done

          make hex CONFIG="$BF_CONFIG" EXTRA_FLAGS="${flags[*]}"

      - name: Rename output
        shell: bash
        run: |
          shopt -s nullglob
          files=(obj/*.hex)
          if (( ${#files[@]} == 0 )); then
            echo "::error::Сборка не создала HEX-файл в obj/"
            exit 1
          fi

          mkdir -p out
          hash=$(printf '%s' "$BF_OPTIONS" | sha256sum | cut -c1-8)
          for file in "${files[@]}"; do
            name=${file##*/}
            cp -- "$file" "out/${name%.hex}_${hash}.hex"
          done

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ inputs.config }}
          path: out/*.hex
          if-no-files-found: error
          retention-days: 30
