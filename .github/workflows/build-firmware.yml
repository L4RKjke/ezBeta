name: Build firmware

on:
  workflow_dispatch:
    inputs:
      config:
        description: 'Таргет платы (CONFIG), например HAKRCF405V2'
        required: true
        type: string
      options:
        description: 'Опции в нотации конфигуратора: CRSF GPS SERVOS'
        required: false
        type: string
        default: ''
      ref:
        description: 'Ветка или тег для сборки (позже придёт из каталога версий)'
        required: false
        type: string
        default: ''
      version:
        description: 'Релиз для выкладки, например ezb-4.5.1-r1. Пусто — только artifact'
        required: false
        type: string
        default: ''


jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      BF_CONFIG: ${{ inputs.config }}
      BF_OPTIONS: ${{ inputs.options }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1
          ref: ${{ inputs.ref || github.ref }}

      - name: Validate and expand options
        shell: bash
        run: |
          set -euo pipefail

          [[ "$BF_CONFIG" =~ ^[A-Z0-9_]{1,32}$ ]] || {
            echo "::error::Недопустимое имя CONFIG"; exit 1; }

          # ENABLE_* может содержать «=значение», остальные — только имена
          [[ ${#BF_OPTIONS} -le 512 && "$BF_OPTIONS" =~ ^[A-Z0-9_+=\ .-]*$ ]] || {
            echo "::error::Недопустимые символы в опциях"; exit 1; }

          jq -e . build_options.json > /dev/null || {
            echo "::error::build_options.json не читается"; exit 1; }

          flags=(-DCLOUD_BUILD)
          read -r -a chosen <<< "$BF_OPTIONS"

          # --- 1. ENABLE_*: полный флаг со значением проходит как есть ---
          for opt in "${chosen[@]}"; do
            if [[ "$opt" == ENABLE_* ]]; then
              [[ "$opt" =~ ^ENABLE_[A-Z0-9_]+(=[A-Za-z0-9_./+,-]{1,64})?$ ]] || {
                echo "::error::Неверный формат ENABLE-флага: $opt"; exit 1; }
              flags+=("$opt")
            fi
          done

          # --- 2. Обычные опции: только имена из каталога ---
          regular=()
          for opt in "${chosen[@]}"; do
            [[ "$opt" == ENABLE_* ]] && continue
            regular+=("$opt")
          done

          if [[ $(printf '%s\n' "${regular[@]}" | sort -u | wc -l) -ne ${#regular[@]} ]]; then
            echo "::error::Дубликат среди опций"; exit 1
          fi

          for opt in "${regular[@]}"; do
            if ! jq -e --arg n "$opt" 'any(.options[]; .name == $n)' \
                 build_options.json > /dev/null; then
              echo "::error::Неизвестная опция: $opt"; exit 1
            fi
          done

          # --- 3. Единичный выбор в группах радио/телеметрия/мотор ---
          for g in radio telemetry motor; do
            cnt=0
            for opt in "${regular[@]}"; do
              if jq -e --arg n "$opt" --arg g "$g" \
                   'any(.options[]; .name == $n and .group == $g)' \
                   build_options.json > /dev/null; then
                cnt=$((cnt+1))
              fi
            done
            [[ $cnt -le 1 ]] || {
              echo "::error::В группе $g допускается только одна опция"; exit 1; }
          done

          # --- 4. Конфликты: между выбранными пользователем ---
          for opt in "${regular[@]}"; do
            for other in "${regular[@]}"; do
              [[ "$opt" == "$other" ]] && continue
              if jq -e --arg o "$opt" --arg t "$other" \
                   'any(.options[]; .name == $o and ((.conflicts // []) | index($t)))' \
                   build_options.json > /dev/null; then
                echo "::error::Опции $opt и $other несовместимы"; exit 1
              fi
            done
          done

          # --- 5. Конфликтующие с выбором дефолты — исключить ---
          excluded=()
          for opt in "${regular[@]}"; do
            while read -r c; do
              [[ -n "$c" ]] && excluded+=("$c")
            done < <(jq -r --arg n "$opt" '.options[] | select(.name == $n) | (.conflicts // [])[]' build_options.json)
          done

          while read -r name; do
            if [[ " ${excluded[*]:-} " == *" $name "* ]]; then
              echo "Пропуск дефолта $name: конфликтует с выбором пользователя"
              continue
            fi
            while read -r f; do
              [[ -n "$f" ]] && flags+=("-D$f")
            done < <(jq -r --arg n "$name" '.options[] | select(.name == $n) | .flags[]' build_options.json)
          done < <(jq -r '.options[] | select(.default == true) | .name')

          # --- 6. Флаги выбранных пользователем опций ---
          for opt in "${regular[@]}"; do
            while read -r f; do
              [[ -n "$f" ]] && flags+=("-D$f")
            done < <(jq -r --arg n "$opt" '.options[] | select(.name == $n) | .flags[]' build_options.json)
          done

          # --- 7. Канонизация: сортировка + дедупликация ---
          mapfile -t flags < <(printf '%s\n' "${flags[@]}" | sort -u)
          canonical=$(printf '%s ' "${flags[@]}")
          echo "Итоговые флаги: $canonical"
          echo "BF_FLAGS_CANONICAL=$canonical" >> "$GITHUB_ENV"

      - name: Install required ARM toolchain
        run: make arm_sdk_install

      - name: Build
        shell: bash
        run: make hex CONFIG="$BF_CONFIG" EXTRA_FLAGS="$BF_FLAGS_CANONICAL"

      - name: Rename output
        shell: bash
        run: |
          shopt -s nullglob
          files=(obj/*.hex)
          if (( ${#files[@]} == 0 )); then
            echo "::error::Сборка не создала HEX-файл в obj/"; exit 1
          fi

          mkdir -p out
          # хэш считаем по каноническим флагам, а не по сырому вводу:
          # одинаковые сборки дают одинаковое имя файла
          hash=$(printf '%s' "$BF_FLAGS_CANONICAL" | sha256sum | cut -c1-8)
          for file in "${files[@]}"; do
            name=${file##*/}
            cp -- "$file" "out/${name%.hex}_${hash}.hex"
          done

      - name: Upload to release
        if: ${{ inputs.version != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BF_VERSION: ${{ inputs.version }}
        run: |
          gh release view "$BF_VERSION" > /dev/null 2>&1 || {
            echo "::error::Релиз $BF_VERSION не существует (сначала release-catalog.yml)"; exit 1; }

          mkdir -p out
          shopt -s nullglob
          for file in out/*.hex; do
            name=${file##*/}
            if gh release view "$BF_VERSION" --json assets -q '.assets[].name' | grep -qx "$name"; then
              echo "Asset $name уже есть в релизе — пропуск"
            else
              gh release upload "$BF_VERSION" "$file"
            fi
          done

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ inputs.config }}
          path: out/*.hex
          if-no-files-found: error
          retention-days: 30
