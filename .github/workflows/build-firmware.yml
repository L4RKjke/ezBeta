name: Build firmware

on:
  workflow_dispatch:
    inputs:
      config:
        description: 'Таргет платы (CONFIG), например HAKRCF405V2'
        required: true
        type: string
      options:
        description: 'EXTRA_FLAGS: флаги через пробел, например USE_VTX USE_SERVOS'
        required: false
        type: string
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Validate inputs
        run: |
          # отсекаем инъекции: только допустимые символы
          echo 'CONFIG="${{ inputs.config }}"' | grep -qE '^CONFIG="[A-Z0-9_]{1,32}"$' \
            || { echo "Bad config name"; exit 1; }
          echo 'OPTIONS="${{ inputs.options }}"' | grep -qE '^OPTIONS="[A-Za-z0-9_ -]{0,512}"$' \
            || { echo "Bad options"; exit 1; }

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive   # забирает lib/modules/mavlink и остальные
          fetch-depth: 1

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi

      - name: Build
        env:
          BF_CONFIG: ${{ inputs.config }}
          BF_OPTIONS: ${{ inputs.options }}
        run: |
          # CLOUD_BUILD зашит здесь, чтобы сборка в CI имела ту же семантику
          # дефолтов, что и облачный билд из конфигуратора
          make hex CONFIG="$BF_CONFIG" \
            EXTRA_FLAGS="-DCLOUD_BUILD $(echo "$BF_OPTIONS" | tr ' ' '\n' | sed 's/.*/-D&/' | tr '\n' ' ')"

      - name: Rename output
        run: |
          mkdir -p out
          for f in obj/*.hex; do
            cp "$f" "out/$(echo "$f" | sed 's/.*\///;s/\.hex$//')_$(echo -n "${{ inputs.options }}" | sha256sum | cut -c1-8).hex"
          done
          ls -lh out/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ inputs.config }}
          path: out/*.hex
          retention-days: 30
